# Demostración gratuita y temporal: no sirve para almacenar datos reales.
# Render Free Postgres vence a los 30 días y NO cuenta con copias de seguridad.
# Render Free Web se suspende tras 15 minutos de inactividad; no tiene disco persistente.
databases:
  - name: preicfes-demo-gratis-db
    plan: free
    region: virginia
    databaseName: preicfes_demo

services:
  - type: web
    name: preicfes-demo-gratis
    runtime: python
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements-demo.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py crear_usuarios_prueba && gunicorn ProyectoDeGrado.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /readyz/
    envVars:
      - key: DJANGO_ENV
        value: demo
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_TRUST_PROXY_SSL_HEADER
        value: "true"
      - key: DJANGO_DATA_ROOT
        value: /tmp/preicfes-free-demo
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PREICFES_DEMO_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: preicfes-demo-gratis-db
          property: connectionString
