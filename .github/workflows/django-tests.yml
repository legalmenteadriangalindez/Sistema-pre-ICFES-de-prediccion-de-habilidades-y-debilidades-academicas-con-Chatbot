name: Pruebas Pre-ICFES

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis de JavaScript
        run: |
          find Principal/static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check tests/javascript/smoke.test.cjs
      - name: Probar módulos y páginas sin controles
        run: node --test tests/javascript/*.test.cjs

  styles:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar parser CSS
        run: python -m pip install 'tinycss2>=1.3,<2'
      - name: Comprobar sintaxis y cascada de CSS
        run: python -m unittest discover -s tests/styles -p 'test_*.py' -v

  django:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_ENV: development
      DJANGO_DEBUG: "true"
      DJANGO_DB_PATH: ci.sqlite3
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: llama3:8b
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar configuración y migraciones
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Ejecutar todas las pruebas Django (sin Ollama)
        run: python manage.py test Principal --verbosity 2

      - name: Comprobar seguridad de configuración (informativo)
        continue-on-error: true
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: "ci-clave-de-prueba-no-usar-en-produccion-clave-muy-larga"
          DJANGO_ALLOWED_HOSTS: "ejemplo.test"
        run: python manage.py check --deploy
