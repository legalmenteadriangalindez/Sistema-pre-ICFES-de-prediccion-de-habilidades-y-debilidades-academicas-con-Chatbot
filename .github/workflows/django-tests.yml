name: Pruebas y calidad Pre-ICFES

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Ruff y Black
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: python -m pip install -r requirements-quality.txt
      - name: Ruff, errores críticos en todo el proyecto
        run: ruff check .
      - name: Ruff, reglas estrictas en módulos adoptados
        run: ruff check --select E,F,I tests/browser/seed_ci.py Principal/IA/LangGraph/graph_chatbot/json_storage.py
      - name: Black, formato comprobado en módulos adoptados
        run: black --diff --check tests/browser/seed_ci.py Principal/IA/LangGraph/graph_chatbot/json_storage.py

  frontend:
    name: ESLint y pruebas JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar herramientas Node
        run: npm install --no-audit --no-fund --package-lock=false
      - name: ESLint (JavaScript de aplicación y Playwright)
        run: npm run lint:js
      - name: Sintaxis JavaScript
        run: |
          find Principal/static/js tests/browser -type f \( -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
          node --check tests/javascript/smoke.test.cjs
      - name: Pruebas de JavaScript sin navegador
        run: npm run test:js

  styles:
    name: Stylelint y CSS
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar linters
        run: |
          npm install --no-audit --no-fund --package-lock=false
          python -m pip install 'tinycss2>=1.3,<2'
      - name: Stylelint (CSS del proyecto)
        run: npm run lint:css
      - name: Sintaxis, tokens, cascada y responsive
        run: python -m unittest discover -s tests/styles -p 'test_*.py' -v

  django:
    name: "Django: pruebas y migraciones"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_ENV: development
      DJANGO_DEBUG: "true"
      DJANGO_DB_PATH: ci.sqlite3
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: llama3:8b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias de Django
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Configuración y migraciones
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Suite completa sin Ollama real
        run: python manage.py test Principal --verbosity 2
      - name: Seguridad de configuración (obligatorio)
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-clave-de-prueba-no-usar-en-produccion-clave-muy-larga
          DJANGO_ALLOWED_HOSTS: ejemplo.test
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          DJANGO_DATA_ROOT: /tmp/preicfes-ci-persistente
        run: python manage.py check --deploy

  browser:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DJANGO_ENV: development
      DJANGO_DEBUG: "true"
      DJANGO_DB_PATH: ci-browser.sqlite3
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      OLLAMA_BASE_URL: http://127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar Django y herramientas de navegador
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          npm install --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps chromium
      - name: Crear base efímera y cuentas E2E
        run: |
          python manage.py migrate --noinput
          python manage.py shell -c "exec(open('tests/browser/seed_ci.py', encoding='utf-8').read())"
      - name: Flujos reales de Chrome sin Ollama
        run: npm run test:browser
      - name: Adjuntar capturas y trazas si falla
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  render-free:
    name: "Render Free: instalación mínima"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_ENV: demo
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "ci-clave-sintetica-exclusiva-para-pruebas-gratis-2026"
      DJANGO_DATA_ROOT: /tmp/preicfes-demo-ci
      DJANGO_TRUST_PROXY_SSL_HEADER: "true"
      RENDER_EXTERNAL_HOSTNAME: demo-example.onrender.com
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar solo las dependencias ligeras
        run: python -m pip install -r requirements-demo.txt
      - name: Validar imports, configuración y archivos estáticos
        run: |
          python manage.py check
          python manage.py collectstatic --noinput
