<tr>
  <td>{{ table_item.nombre }} {{ table_item.apellido }}</td>
  <td>{{ table_item.documento }}</td>
  <td>
    <form method="post" action="{% url 'eliminar_admin_gestion_users' 'personas' table_item.pk %}" data-confirm="¿Eliminar a esta persona y sus datos relacionados?">

      <button type="submit" class="ui-btn ui-btn-danger">Eliminar</button>
    </form>
  </td>
</tr>
