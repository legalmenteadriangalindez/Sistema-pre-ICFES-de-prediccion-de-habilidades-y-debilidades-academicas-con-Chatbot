[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 100
respect-gitignore = true
extend-exclude = [".venv", "env", "venv", "node_modules", ".local-data", ".private-media", "Principal/migrations"]

# Línea base gradual: errores de sintaxis y nombres críticos en todo el repositorio.
# Calidad estricta E/F/I solo para módulos migrados o recién creados en CI.
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
